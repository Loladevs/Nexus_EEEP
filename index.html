<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f1df">
  <meta name="description" content="Nexus — protótipo de plataforma para conectar estudante, escola, estágio, projetos e oportunidades.">
  <title>Nexus — Sua jornada começa aqui</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-mark">N</div>

        <div>
          <strong>Nexus</strong>
          <span>jornada estudantil</span>
        </div>
      </div>

      <div class="seduc-context">

        <img
          src="https://www.seduc.ce.gov.br/wp-content/uploads/sites/37/2021/04/002_marca_horizontal_color.png"
          alt="SEDUC Ceará"
          onerror="this.style.display='none'"
        >

        <small>
          Protótipo inspirado no contexto educacional do Ceará
        </small>

      </div>

      <nav class="main-nav" aria-label="Navegação principal">

        <button class="nav-item active" data-view="inicio">
          <span>⌂</span>
          Início
        </button>

        <button class="nav-item" data-view="perfil">
          <span>◌</span>
          Meu perfil
        </button>

        <button class="nav-item" data-view="competencias">
          <span>✦</span>
          Competências
        </button>

        <button class="nav-item" data-view="estagio">
          <span>▣</span>
          Meu estágio
        </button>

        <button class="nav-item" data-view="oportunidades">
          <span>↗</span>
          Oportunidades
        </button>

        <button class="nav-item" data-view="portfolio">
          <span>▤</span>
          Portfólio
        </button>

        <button class="nav-item" data-view="comunicacao">
          <span>♡</span>
          Comunicação
        </button>

      </nav>

      <div class="sidebar-bottom">

        <button class="nav-item" data-view="secretaria">
          <span>⌁</span>
          Central da secretaria
        </button>

        <button class="nav-item" data-view="config">
          <span>⚙</span>
          Configurações
        </button>

        <div class="privacy-note">

          <span class="tiny-lock">⌕</span>

          <div>
            <b>Dados protegidos</b>
            <small>Protótipo com acesso por perfil.</small>
          </div>

        </div>

      </div>

    </aside>


    <main class="main-content">

      <header class="topbar">

        <button
          class="mobile-menu"
          id="mobileMenu"
          aria-label="Abrir menu"
        >
          ☰
        </button>

        <div class="crumb">
          Nexus
          <span>/</span>
          <strong id="pageName">Início</strong>
        </div>

        <div class="top-actions">

          <button
            class="icon-btn"
            id="notificationBtn"
            aria-label="Notificações"
          >
            ♧
            <i></i>
          </button>

          <button class="profile-mini" id="profileQuick">

            <img
              src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=85"
              alt="Foto de perfil de demonstração"
            >

            <span>Ana</span>
            <b>⌄</b>

          </button>

        </div>

      </header>

      <section id="viewContainer"></section>

    </main>

  </div>


  <div class="modal-backdrop" id="modalBackdrop">

    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <button
        class="modal-close"
        id="modalClose"
        aria-label="Fechar"
      >
        ×
      </button>

      <div id="modalContent"></div>

    </div>

  </div>


  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>

</body>
</html>
